<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Handmade soy candles inspired by nature. Discover calming scents for a cozier home, with eco-friendly packaging and fast shipping across the EU.">

<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <header>
        <a href="home.html" class="logo">
            <i></i>
            <p class="logo-text">Ember</p>
        </a>
        <div class="navbar">
            <a href="index.html">Home</a>
            <a href="all.html">Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            </div>
            <nav class="header-icons">
    <a href="/search" aria-label="Search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/>
    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
</a>
<a href="/wishlist" aria-label="Wishlist">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
  </svg>
</a>
<a href="/cart" class="cart" aria-label="Cart">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
    <line x1="3" y1="6" x2="21" y2="6"/>
    <path d="M16 10a4 4 0 0 1-8 0"/>
  </svg>
  <span class="badge">0</span>
</a>
</nav>
    </header>
    <main>
<h1>Your Cart<span class="cart-count"></span></h1>
<p class="cart-empty" hidden>Your Cart Is Empty<a href="all.html">Browse our candles</a></p>
<div class="cart-content">
    <ul class="cart-items"></ul>
    <form class="promo">
        <label for="promo-code">Have a Promo Code?</label>
        <input type="text" id="promo-code" placeholder="Enter code...">
        <button type="submit">Apply</button>
        <p id="promo-message" aria-live="polite"></p>
    </form>
    <div class="cart-summary">
        <dl>
            <div>
                <dt>Subtotal</dt>
                <dd id="subtotal">$0</dd>
            </div>
            <div id="discount-row" hidden>
                <dt>Discount</dt>
                <dd id="discount">$0</dd>
            </div>
            <div>
                <dt>Shipping</dt>
                <dd>Calculated at checkout</dd>
            </div>
            <div class="cart-total">
                <dt>Total</dt>
                <dd id="total">$0</dd>
            </div>
        </dl>
        <a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
    </div>
</div>
<a href="all.html" class="continue-link">Continue Shopping</a>
    </main>
      <footer>
        <div class="footer-text">
 <a href="home.html" class="logo">
            <i></i>
            <p class="logo-text">Ember</p>
        </a>

   </div>
</footer>
<script src="cart.js"></script>
</body>
</html>
